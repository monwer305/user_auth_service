[project]
name = "auth_service"
version = "0.1.0"
description = "FastAPI Auth & User Management Service"
authors = [
    { name = "Md Monwer Hussain", email = "mdmonwer305@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "pymysql>=1.1.0",
    "pyjwt>=2.8.0",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0.post1",
    "python-dotenv>=1.0.1",
    "cryptography (>=46.0.1,<47.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app" }
]
